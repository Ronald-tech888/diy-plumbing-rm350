    body {

    .fact {

      padding: 13px 14px;
      font-weight: 850;
    }

    .fact span {
      display: block;

    .price-note {

    }

    form {
      display: grid;
      gap: 16px;
    }

    label {
      display: grid;
      gap: 7px;
      font-weight: 850;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #cfdce6;
      border-radius: 14px;
      padding: 13px 14px;
      font: inherit;
      color: var(--ink);
      background: white;

    textarea {
      min-height: 96px;

    input:focus,
    select:focus,
    textarea:focus {
      outline: 3px solid rgba(17, 103, 177, .16);
      border-color: var(--blue);
    }

    .field-note {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    .radio-grid {

<body>
  <main class="wrap">
    <a class="back" href="index.html">← 返回课程页面</a>

    <div class="page-grid">
      <section class="panel">
        <div class="eyebrow">报名</div>
        <h1>预留你的家居水管维修课程名额</h1>
        <p>填写联络资料后，即可查看 RM280（早鸟价）付款方式。</p>

        <div class="facts">
          <div class="fact"><span>课程</span> 零基础家居水管维修实作课</div>
          <div class="fact"><span>日期</span> 2026年9月12日（星期六）</div>
          <div class="fact"><span>时间</span> 上午9:00至下午1:00</div>
          <div class="fact"><span>地点</span> Damansara Damai, Petaling Jaya</div>
          <div class="fact"><span>人数</span> 最多12人</div>
        </div>

        <div class="price-note">课程费用：RM280（早鸟价）。</div>
      </section>

      <section class="panel">
        <h2>填写3项资料即可继续</h2>
        <p>RM280（早鸟价）课程名额与9月12日场次已为你选好。</p>

        <form action="https://formspree.io/f/mojbnpwl" method="POST">
          <input type="hidden" name="_subject" value="New Mandarin RM280 Registration - DIY Plumbing 12 September 2026">
          <input type="hidden" name="_next" value="https://ronald-tech888.github.io/diy-plumbing-rm350/zh/thanks.html">
          <input type="hidden" name="Lead Source" id="lead-source" value="mandarin-direct-registration">
          <input type="hidden" name="Ticket" value="Early Bird - RM280">
          <input type="hidden" name="Workshop Date" value="12 September 2026">
          <input type="text" name="_gotcha" style="display:none">

          <label>
            姓名 *
            <input name="Full Name" type="text" autocomplete="name" placeholder="例如：陈美玲" required>
          </label>

          <label>
            电邮地址 *
            <input name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          </label>

          <label>
            WhatsApp / 手机号码 *
            <input name="WhatsApp / Mobile" type="tel" inputmode="tel" autocomplete="tel" placeholder="例如：013-308 3049" required pattern="^\+?[0-9\-\s]{8,20}$" title="请输入有效的手机号码">
            <span class="field-note">若使用马来西亚以外的号码，请加入国家区号。</span>
          </label>

          <button class="btn" type="submit">继续查看 RM280 付款方式</button>
          <p class="privacy">下一步：查看 Touch 'n Go 或银行转账资料，并一键通过 WhatsApp 发送付款凭证。付款后才确认名额。课程开始前3天内不退款，但可转让名额。</p>
        </form>
      </section>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const leadSource = params.get('source') || 'mandarin-direct-registration';
    document.getElementById('lead-source').value = 'mandarin-' + leadSource.replace(/^mandarin-/, '');

    document.querySelector('form').addEventListener('submit', async function(event) {
      event.preventDefault();

      const form = event.currentTarget;
      const button = form.querySelector('button[type="submit"]');
      const originalText = button.textContent;
      button.disabled = true;
      button.textContent = '正在提交...';

      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
          if (typeof fbq === 'function') {
            fbq('track', 'Lead', {
              content_name: 'DIY Plumbing Level 1 Mandarin - 12 September 2026',
              content_category: 'Workshop',
              value: 280,
              currency: 'MYR'
            });
          }
          if (typeof gtag === 'function') {
            gtag('event', 'submit_registration', {
              event_category: 'registration_form',
              event_label: 'DIY Plumbing Mandarin 12 September 2026'
            });
          }
          window.setTimeout(function() {
            window.location.href = 'thanks.html';
          }, 300);
          return;
        }

        throw new Error('Form submission failed');
      } catch (error) {
        alert('抱歉，表格无法提交。请再试一次，或 WhatsApp +6013-308-3049。');
        button.disabled = false;
        button.textContent = originalText;
      }
    });
  </script>
