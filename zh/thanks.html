  <style>
    :root {
      --ink: #17202a;
      --muted: #5e6a75;
      --blue: #1167b1;
      --blue-dark: #0b4f89;
      --yellow: #ffc857;
      --green: #168a5b;
      --soft: #f4f8fb;
      --line: #dce6ee;
      --shadow: 0 18px 45px rgba(14, 44, 69, .14);
      --radius: 24px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(255, 200, 87, .35), transparent 35%),
        linear-gradient(135deg, #ffffff 0%, #ecf7ff 100%);
      line-height: 1.55;
    }

    .card {
      width: min(820px, 100%);
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: clamp(28px, 5vw, 48px);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      background: #def7ec;
      color: var(--green);
      font-size: 38px;
      font-weight: 950;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(34px, 5vw, 56px);
      line-height: 1;
      letter-spacing: -.045em;
    }

    p {
      color: var(--muted);
      font-size: 18px;
      margin: 0 auto 18px;
      max-width: 620px;
    }

    .next {
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      text-align: left;
      margin: 26px auto;
      max-width: 560px;
    }

    .next strong {
      display: block;
      margin-bottom: 8px;
      font-size: 18px;
    }

    .next ol {
      margin: 0;
      padding-left: 22px;
      color: var(--muted);
    }

    .payment {
      background: #fffaf1;
      border: 2px solid #ffe2b5;
      border-radius: 20px;
      padding: 22px;
      margin: 24px auto;
      text-align: left;
      max-width: 640px;
    }

    .payment h2 {
      margin: 0 0 14px;
      color: #b06900;
      font-size: 24px;
      letter-spacing: -.02em;
    }

    .payment p {
      margin: 8px 0;
      font-size: 17px;
      color: #2d3339;
      max-width: none;
    }

    .payment strong {
      color: var(--blue-dark);
    }

    .pay-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 20px auto 8px;
      max-width: 640px;
    }

    .contact-card {
      border-radius: 18px;
      padding: 16px;
      text-align: center;
      text-decoration: none;
      font-weight: 950;
    }

    .whatsapp {
      background: #25D366;
      color: white;
    }

    .email {
      background: var(--soft);
      color: var(--blue-dark);
      border: 1px solid var(--line);
    }

    .urgent-note {
      background: #fff1bf;
      border: 1px solid #ffe08a;
      border-radius: 16px;
      padding: 14px 16px;
      color: #3b2b00;
      font-weight: 850;
      max-width: 640px;
      margin: 18px auto;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 22px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 14px 22px;
      text-decoration: none;
      font-weight: 950;
    }

    .btn-primary {
      background: var(--blue);
      color: white;
      box-shadow: 0 12px 24px rgba(17, 103, 177, .24);
    }

    .btn-secondary {
      background: white;
      color: var(--blue-dark);
      border: 1px solid var(--line);
    }

    @media (max-width: 640px) {
      .pay-actions {
        grid-template-columns: 1fr;
      }
    }
  [hidden] { display: none !important; }
